<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your SwimBuddz email</title>
  </head>
  <body style="margin: 0; padding: 24px 12px; background-color: #f8fafc; font-family: Arial, Helvetica, sans-serif; color: #0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width: 100%; max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden">
          <tr><td align="center" bgcolor="#0891b2" style="padding: 40px 24px; background: linear-gradient(120deg, #0891b2, #06b6d4); color: #ffffff; font-size: 32px; font-weight: bold">SwimBuddz</td></tr>
          <tr><td align="center" style="padding: 40px 24px">
            <h1 style="margin: 0 0 24px; font-size: 26px; line-height: 1.3; color: #0f172a">Welcome to the Community! 🏊</h1>
            <p style="margin: 0 0 32px; font-size: 17px; line-height: 1.6; color: #475569">Thanks for signing up for SwimBuddz. We're excited to have you on board! Please confirm your email address to complete your registration and start your journey.</p>
            <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td align="center" bgcolor="#0891b2" style="border-radius: 32px; background-color: #0891b2">
              <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 18px 30px; border-radius: 32px; background-color: #0891b2; color: #ffffff !important; -webkit-text-fill-color: #ffffff; font-size: 18px; font-weight: bold; text-decoration: none !important"><span style="color: #ffffff !important; -webkit-text-fill-color: #ffffff">Confirm Email Address</span></a>
            </td></tr></table>
            <p style="margin: 32px 0 0; color: #64748b; font-size: 14px; line-height: 1.6">If you didn't request this email, you can safely ignore it.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
