name: StrokeLab API contract reproducibility
on:
  push:
    branches:
      - codex/strokelab-hardening-20261119
permissions:
  contents: write
jobs:
  check-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Match backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "fastapi==0.111.1" "pydantic==2.12.5" "pydantic-settings==2.13.1"
          python -c "import fastapi,pydantic,pydantic_settings;print('API Versions',fastapi.__version__,pydantic.__version__,pydantic_settings.__version__)"
      - name: Check deterministic generation and update contract
        run: |
          python scripts/api/generate-openapi.py > /tmp/api-first.json
          python scripts/api/generate-openapi.py > /tmp/api-second.json
          cmp /tmp/api-first.json /tmp/api-second.json
          cp /tmp/api-first.json openapi.json
          python -m json.tool openapi.json >/dev/null
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "docs(strokelab): synchronize deterministic API schema"
            git push
          fi
