name: Temporary Academy OpenAPI regeneration
on:
  push:
    branches: [feature/academy-per-student-session-entitlements]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/academy-per-student-session-entitlements'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academy-per-student-session-entitlements
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and commit API schema to feature branch only
        run: |
          pip install -e .
          python scripts/api/generate-openapi.py > openapi.json
          if git diff --quiet -- openapi.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git commit -m 'chore(api): regenerate Academy student participation OpenAPI'
          git push origin HEAD:feature/academy-per-student-session-entitlements
