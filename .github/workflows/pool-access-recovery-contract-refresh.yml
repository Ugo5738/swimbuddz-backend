name: Pool Access Recovery Contract Refresh
on:
  push:
    branches: [codex/pool-access-platform]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
          ruff check --fix services/pools_service/models/access.py services/pools_service/routers/access.py services/pools_service/routers/access_redemption.py services/pools_service/routers/access_internal.py services/payments_service/routers/intents/intent_creation.py services/payments_service/services/product_intent_retry.py tests/integration/test_pool_access_bookings.py || true
          ruff format services/pools_service/models/access.py services/pools_service/routers/access.py services/pools_service/routers/access_redemption.py services/pools_service/routers/access_internal.py services/payments_service/routers/intents/intent_creation.py services/payments_service/services/product_intent_retry.py tests/integration/test_pool_access_bookings.py services/pools_service/alembic/versions/ac20261008d4_cancel_requests.py services/pools_service/alembic/versions/ac20261008e5_partner_settlements.py
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || (git commit -m "chore: refresh Pool Access refund and settlement contract" && git push)
