name: One-shot paid Academy formatting and OpenAPI update
on:
  push:
    branches: [codex/academy-transfer-paid-allocations]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[academy-paid-contract-synced]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-transfer-paid-allocations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: ruff format services/payments_service/routers/academy_receipts.py services/payments_service/routers/manual_recording.py
      - name: Regenerate API contract
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
        run: python scripts/api/generate-openapi.py > openapi.json
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/payments_service/routers/academy_receipts.py services/payments_service/routers/manual_recording.py openapi.json
            git commit -m "chore(academy): format and synchronize receipt operations [academy-paid-contract-synced]"
            git push origin HEAD:codex/academy-transfer-paid-allocations
          fi
