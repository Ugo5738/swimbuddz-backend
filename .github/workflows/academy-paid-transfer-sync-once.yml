name: One-shot paid Academy transfer formatting and OpenAPI
on:
  push:
    branches: [codex/academy-transfer-paid-allocations]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[academy-paid-contract-synced]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-transfer-paid-allocations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -c constraints.txt
      - name: Format changed services and tests
        run: |
          ruff format \
            services/payments_service/models/academy_receipts.py \
            services/academy_service/models/financial_credit.py \
            services/payments_service/models/__init__.py \
            services/academy_service/models/__init__.py \
            services/payments_service/routers/academy_receipts.py \
            services/payments_service/routers/internal.py \
            services/payments_service/routers/intents/__init__.py \
            services/payments_service/routers/intents/_entitlement/_dispatcher.py \
            services/payments_service/routers/intents/completion.py \
            services/payments_service/routers/manual.py \
            services/payments_service/routers/manual_recording.py \
            services/payments_service/services/manual_transfer.py \
            services/academy_service/routers/internal.py \
            services/academy_service/routers/enrollments/change_cohort.py \
            services/academy_service/routers/enrollments/paid_transfer.py \
            services/academy_service/routers/enrollments/admin_payments.py \
            services/academy_service/routers/enrollments/__init__.py \
            tests/integration/test_academy_shared_receipts.py
      - name: Generate backend OpenAPI contract
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
        run: python scripts/api/generate-openapi.py > openapi.json
      - run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore(academy): format services and regenerate contract [academy-paid-contract-synced]"
            git push origin HEAD:codex/academy-transfer-paid-allocations
          fi
