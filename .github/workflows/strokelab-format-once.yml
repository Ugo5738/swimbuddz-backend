name: Temporary StrokeLab formatter
on:
  push:
    branches:
      - codex/strokelab-hardening-20261119
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.4.10
      - run: |
          ruff format services/ai_service/analysis/storage.py services/ai_service/routers/analyze.py services/ai_service/routers/public.py services/ai_service/services/credit_ops.py services/ai_service/services/email_auth.py services/ai_service/tasks/maintenance.py
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add services/ai_service
            git commit -m 'style(strokelab): apply Ruff formatter'
            git push
          fi
