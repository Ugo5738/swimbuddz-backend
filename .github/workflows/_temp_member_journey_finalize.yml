name: Temporary member journey formatting
on:
  push:
    branches: [codex/member-journey-quickbooking-20261027]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(member): format member journey')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/member-journey-quickbooking-20261027
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.4.10
          ruff format services/communications_service/tasks/session_notifications.py services/members_service/routers/members/me.py
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/communications_service/tasks/session_notifications.py services/members_service/routers/members/me.py
          if ! git diff --cached --quiet; then
            git commit -m "style(member): format member journey"
            git push
          fi
