name: Academy PR code formatting
on:
  push:
    branches:
      - codex/academy-transfer-paid-allocations

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(academy): apply Ruff formatter')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format changed backend sources
        run: |
          python -m pip install 'ruff==0.4.10'
          ruff format services/academy_service/models/__init__.py services/academy_service/models/financial_credit.py services/academy_service/routers/enrollments/paid_transfer.py services/payments_service/routers/manual.py tests/integration/test_academy_shared_receipts.py
      - name: Commit generated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add services/academy_service/models/__init__.py services/academy_service/models/financial_credit.py services/academy_service/routers/enrollments/paid_transfer.py services/payments_service/routers/manual.py tests/integration/test_academy_shared_receipts.py
          git commit -m "chore(academy): apply Ruff formatter"
          git push origin HEAD:codex/academy-transfer-paid-allocations
