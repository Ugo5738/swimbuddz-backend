name: Temporary financial obligations formatting
on:
  push:
    branches:
      - codex/member-financial-obligations-aggregator
    paths:
      - .github/workflows/temporary-financial-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format only the financial obligations changes
        run: |
          python -m pip install ruff==0.4.10
          ruff format services/payments_service/routers/intents/obligations.py services/sessions_service/routers/internal.py tests/unit/test_member_financial_obligations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/payments_service/routers/intents/obligations.py services/sessions_service/routers/internal.py tests/unit/test_member_financial_obligations.py
          if ! git diff --cached --quiet; then
            git commit -m "style(finance): apply repository Ruff formatting"
            git push origin HEAD:codex/member-financial-obligations-aggregator
          fi
