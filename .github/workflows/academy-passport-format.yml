name: Temporary Academy Passport Formatter
on:
  push:
    branches:
      - codex/academy-competency-passport-20261123
permissions:
  contents: write
jobs:
  format-contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-competency-passport-20261123
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format and regenerate Academy API contract
        run: |
          ruff check --fix services/academy_service/models/competency.py services/academy_service/routers/competencies.py tests/integration/test_academy_competency_passport.py
          ruff format services/academy_service/models/competency.py services/academy_service/routers/competencies.py services/academy_service/alembic/versions/a20261123_competency_passport.py tests/integration/test_academy_competency_passport.py services/academy_service/models/__init__.py services/academy_service/app/main.py
          python scripts/api/generate-openapi.py > openapi.json
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/models/competency.py services/academy_service/routers/competencies.py services/academy_service/alembic/versions/a20261123_competency_passport.py tests/integration/test_academy_competency_passport.py services/academy_service/models/__init__.py services/academy_service/app/main.py openapi.json
            git commit -m "chore(academy): format portable passport and regenerate OpenAPI"
            git push origin HEAD:codex/academy-competency-passport-20261123
          fi
