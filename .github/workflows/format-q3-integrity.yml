name: Temporary Ruff Format Q3 Integrity

on:
  push:
    branches:
      - feature/q3-reporting-integrity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/q3-reporting-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.4.10
      - run: |
          ruff format \
            services/members_service/routers/internal/quarter_reports.py \
            services/reporting_service/routers/admin_reports.py \
            services/reporting_service/services/aggregator.py \
            services/reporting_service/services/business_review.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/members_service/routers/internal/quarter_reports.py \
                  services/reporting_service/routers/admin_reports.py \
                  services/reporting_service/services/aggregator.py \
                  services/reporting_service/services/business_review.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feature/q3-reporting-integrity
