name: Temporary directory Ruff formatter
on:
  push:
    branches:
      - feature/public-pool-directory-20261021
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(pools): Ruff-formatted directory files')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-pool-directory-20261021
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format only modified pool directory files
        run: |
          pip install ruff==0.4.10
          ruff format services/pools_service/app/main.py services/pools_service/models/__init__.py services/pools_service/models/directory_review.py services/pools_service/models/pool.py services/pools_service/routers/admin_submissions.py services/pools_service/routers/directory.py services/pools_service/schemas/directory.py
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pools_service/
          if ! git diff --cached --quiet; then
            git commit -m "style(pools): Ruff-formatted directory files"
            git push
          fi
