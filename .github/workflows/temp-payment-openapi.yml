name: Temporary payment OpenAPI regeneration
on:
  push:
    branches:
      - feature/payment-proof-flexible-verification-20261025
env:
  DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
permissions:
  contents: write
jobs:
  regenerate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Regenerate pinned API contract
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit contract
        run: |
          if ! git diff --quiet -- openapi.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add openapi.json
            git commit -m 'Regenerate API schema for flexible payment evidence'
            git push origin HEAD:feature/payment-proof-flexible-verification-20261025
          fi
