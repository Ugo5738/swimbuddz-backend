name: Temporary OpenAPI Q3 Integrity

on:
  push:
    branches:
      - feature/q3-reporting-integrity

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/q3-reporting-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - run: python scripts/api/generate-openapi.py > openapi.json
      - run: |
          if git diff --quiet -- openapi.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(api): regenerate OpenAPI for Q3 integrity"
          git push origin HEAD:feature/q3-reporting-integrity
