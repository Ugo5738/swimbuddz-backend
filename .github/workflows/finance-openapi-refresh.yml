name: Finance OpenAPI regeneration (temporary)

on:
  push:
    branches:
      - codex/finance-treasury-controls-20261117
    paths:
      - .github/workflows/finance-openapi-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Ugo5738/swimbuddz-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate and commit checked-in OpenAPI (feature branch only)
        run: |
          set -euo pipefail
          python scripts/api/generate-openapi.py > /tmp/finance-openapi.json
          test -s /tmp/finance-openapi.json
          python -m json.tool /tmp/finance-openapi.json >/dev/null
          mv /tmp/finance-openapi.json openapi.json
          if git diff --quiet -- openapi.json; then
            echo "OpenAPI already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- openapi.json
          git commit -m "chore(api): regenerate OpenAPI for finance treasury endpoints"
          git push origin HEAD:refs/heads/codex/finance-treasury-controls-20261117
