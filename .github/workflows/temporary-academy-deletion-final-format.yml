name: Temporary Academy Deletion Final Format
on:
  push:
    branches: [codex/academy-safe-enrollment-deletion-20261011]
    paths: [.github/workflows/temporary-academy-deletion-final-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install ruff==0.4.10
          ruff format services/academy_service/routers/enrollments/delete_empty.py
          ruff check services/academy_service/routers/enrollments/delete_empty.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/routers/enrollments/delete_empty.py
            git commit -m "style(academy): format pending test-transfer cleanup"
            git push origin HEAD:codex/academy-safe-enrollment-deletion-20261011
          fi
