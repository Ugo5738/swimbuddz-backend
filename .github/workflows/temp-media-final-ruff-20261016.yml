name: Temporary Final My Media Ruff Format
on:
  push:
    branches: [feature/member-my-media-playback-links-20261016]
    paths: [.github/workflows/temp-media-final-ruff-20261016.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-my-media-playback-links-20261016
          fetch-depth: 0
      - run: |
          python -m pip install ruff==0.4.10
          ruff format services/media_service/routers/vaults.py
      - run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add services/media_service/routers/vaults.py
          if ! git diff --cached --quiet; then
            git commit -m "Format final My Media permission changes"
            git push origin HEAD:feature/member-my-media-playback-links-20261016
          fi
