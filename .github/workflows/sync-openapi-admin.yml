name: Sync OpenAPI on admin UX branch

on:
  push:
    branches:
      - feature/admin-operations-ux

permissions:
  contents: write

jobs:
  sync-openapi:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-operations-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate OpenAPI
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit generated contract
        run: |
          if git diff --quiet -- openapi.json; then
            echo "OpenAPI already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(api): regenerate OpenAPI for admin UX"
          git push origin HEAD:feature/admin-operations-ux
