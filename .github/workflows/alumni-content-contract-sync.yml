name: Temporary alumni content contract sync
on:
  push:
    branches:
      - codex/alumni-evidence-beyond-pool
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical Python format and regenerate OpenAPI
        run: |
          python -m pip install -e ".[dev]" -c constraints.txt
          ruff format services/communications_service/schemas/main.py services/members_service/routers/internal/flywheel.py services/members_service/routers/internal/_schemas.py services/reporting_service/tasks/flywheel.py services/academy_service/routers/evidence.py services/reporting_service/models/__init__.py services/reporting_service/models/content_acquisition.py services/reporting_service/tasks/content_acquisition.py services/reporting_service/tasks/worker.py services/reporting_service/routers/admin_flywheel.py
          python scripts/api/generate-openapi.py > openapi.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add services/communications_service/schemas/main.py services/members_service/routers/internal/flywheel.py services/members_service/routers/internal/_schemas.py services/reporting_service/tasks/flywheel.py services/academy_service/routers/evidence.py services/reporting_service/models/__init__.py services/reporting_service/models/content_acquisition.py services/reporting_service/tasks/content_acquisition.py services/reporting_service/tasks/worker.py services/reporting_service/routers/admin_flywheel.py openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): format and sync content attribution contracts"
            git push origin HEAD:codex/alumni-evidence-beyond-pool
          fi
