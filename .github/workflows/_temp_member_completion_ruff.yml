name: Temporary member completion Ruff
on:
  push:
    branches: [feature/member-experience-completion-oct27]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(member): format name change audit')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/member-experience-completion-oct27
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format changed member files
        run: |
          python -m pip install ruff==0.4.10
          ruff format services/members_service/models/__init__.py services/members_service/models/name_change.py services/members_service/routers/members/me.py services/members_service/alembic/versions/b20261027name_history.py services/communications_service/tasks/session_notifications.py
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/members_service/ services/communications_service/tasks/session_notifications.py
          if ! git diff --cached --quiet; then
            git commit -m "style(member): format name change audit"
            git push
          fi
