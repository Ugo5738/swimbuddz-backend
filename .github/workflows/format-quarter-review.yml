name: Temporary Ruff Format

on:
  push:
    branches:
      - feature/quarterly-business-review

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-business-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff==0.4.10
      - name: Format touched Python files
        run: |
          ruff format \
            services/academy_service/routers/internal.py \
            services/ledger_service/routers/internal.py \
            services/members_service/routers/internal/quarter_reports.py \
            services/reporting_service/routers/admin_reports.py \
            services/reporting_service/services/business_review.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/academy_service/routers/internal.py \
                  services/ledger_service/routers/internal.py \
                  services/members_service/routers/internal/quarter_reports.py \
                  services/reporting_service/routers/admin_reports.py \
                  services/reporting_service/services/business_review.py
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feature/quarterly-business-review
