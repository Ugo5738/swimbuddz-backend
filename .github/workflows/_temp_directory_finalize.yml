name: Temporary directory finalization
on:
  push:
    branches: [codex/pool-directory-discovery-hardening]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, 'chore(api): finalize directory contract')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pool-directory-discovery-hardening
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format and generate pinned API spec
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/swimbuddz
        run: |
          python -m pip install -e ".[dev]" -c constraints.txt
          ruff format services/pools_service/routers/directory.py services/pools_service/routers/public.py services/pools_service/schemas/public_partner.py services/pools_service/schemas/directory.py services/pools_service/services/directory_geo.py services/pools_service/routers/admin_submissions.py tests/pools/test_directory_geo.py tests/pools/test_directory_public_contract.py
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pools_service/ tests/pools/test_directory_geo.py tests/pools/test_directory_public_contract.py openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): finalize directory contract"
            git push
          fi
