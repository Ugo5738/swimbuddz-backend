name: Temporary Academy Terms Formatter

on:
  push:
    branches:
      - codex/academy-transfer-guided-review-20261009
    paths:
      - .github/workflows/temporary-academy-terms-formatter.yml

permissions:
  contents: write

jobs:
  format-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format touched Academy files
        run: |
          python -m pip install ruff==0.4.10
          ruff format services/academy_service/models/commercial_adjustment.py services/academy_service/routers/enrollments/commercial_terms.py tests/integration/test_academy_commercial_terms.py
          ruff check services/academy_service/models/commercial_adjustment.py services/academy_service/routers/enrollments/commercial_terms.py tests/integration/test_academy_commercial_terms.py
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/models/commercial_adjustment.py services/academy_service/routers/enrollments/commercial_terms.py tests/integration/test_academy_commercial_terms.py
            git commit -m "style(academy): format commercial terms files with Ruff"
            git push origin HEAD:codex/academy-transfer-guided-review-20261009
          fi
