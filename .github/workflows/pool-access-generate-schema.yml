name: Refresh Pool Access OpenAPI
on:
  push:
    branches: [codex/pool-access-platform]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Generate backend OpenAPI contract
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git diff --cached --quiet || (git commit -m "chore: regenerate Pool Access OpenAPI contract" && git push)
