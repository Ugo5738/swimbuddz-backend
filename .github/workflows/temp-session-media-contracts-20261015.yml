name: Temporary Session Media Contract Regeneration

on:
  push:
    branches:
      - feature/session-media-upload-clips-20261015
    paths:
      - .github/workflows/temp-session-media-contracts-20261015.yml

env:
  DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
  DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db

permissions:
  contents: write

jobs:
  update-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-media-upload-clips-20261015
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format and regenerate API
        run: |
          ruff check . --fix
          ruff format services/media_service/models/core.py services/media_service/models/vault.py services/media_service/routers/vaults.py services/media_service/tasks/member_clips.py services/media_service/schemas/vault.py services/media_service/alembic/versions/c815f2ae4100_session_media_access_and_clips.py tests/unit/test_session_media_access_and_clips.py
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit updates
        run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add openapi.json services/media_service tests/unit/test_session_media_access_and_clips.py
          if ! git diff --cached --quiet; then
            git commit -m "Format session media changes and refresh OpenAPI"
            git push origin HEAD:feature/session-media-upload-clips-20261015
          fi
