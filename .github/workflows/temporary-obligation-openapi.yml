name: Temporary financial obligations OpenAPI generation
on:
  push:
    branches:
      - codex/member-financial-obligations-aggregator
    paths:
      - .github/workflows/temporary-obligation-openapi.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate contract with project dependencies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DATABASE_SESSION_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          python -m pip install -e .
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(api): regenerate OpenAPI for financial obligations"
            git push origin HEAD:codex/member-financial-obligations-aggregator
          fi
