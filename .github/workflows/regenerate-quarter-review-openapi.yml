name: Temporary OpenAPI Regeneration

on:
  push:
    branches:
      - feature/quarterly-business-review

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quarterly-business-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate OpenAPI
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit contract
        run: |
          if git diff --quiet -- openapi.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(api): regenerate OpenAPI contract"
          git push origin HEAD:feature/quarterly-business-review
