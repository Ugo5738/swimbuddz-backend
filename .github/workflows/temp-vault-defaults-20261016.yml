name: Temporary Vault Defaults Format and Contract
on:
  push:
    branches: [feature/vault-access-defaults-and-member-originals-20261016]
    paths: [.github/workflows/temp-vault-defaults-20261016.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vault-access-defaults-and-member-originals-20261016
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - run: |
          ruff check . --fix
          ruff format services/media_service/models/vault.py services/media_service/models/core.py services/media_service/schemas/vault.py services/media_service/routers/vaults.py services/media_service/alembic/versions/d16c8b019ea4_vault_media_default_permissions.py tests/unit/test_vault_media_permission_defaults.py
          python scripts/api/generate-openapi.py > openapi.json
      - run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add openapi.json services/media_service tests/unit/test_vault_media_permission_defaults.py
          if ! git diff --cached --quiet; then
            git commit -m "Format vault defaults and regenerate OpenAPI"
            git push origin HEAD:feature/vault-access-defaults-and-member-originals-20261016
          fi
