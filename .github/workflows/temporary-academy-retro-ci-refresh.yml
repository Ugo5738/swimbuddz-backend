name: Temporary Academy Retro Format and Schema

on:
  push:
    branches:
      - codex/academy-retroactive-receipt-adoption-20261009
    paths:
      - .github/workflows/temporary-academy-retro-ci-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format and regenerate schema
        run: |
          ruff format services/payments_service/routers/academy_receipts.py services/payments_service/models/academy_receipts.py services/payments_service/alembic/versions/a20261009retro_receipt_adoption.py tests/integration/test_academy_retroactive_receipt.py
          ruff check services/payments_service/routers/academy_receipts.py services/payments_service/models/academy_receipts.py services/payments_service/alembic/versions/a20261009retro_receipt_adoption.py tests/integration/test_academy_retroactive_receipt.py
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit generated files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/payments_service/routers/academy_receipts.py services/payments_service/models/academy_receipts.py services/payments_service/alembic/versions/a20261009retro_receipt_adoption.py tests/integration/test_academy_retroactive_receipt.py openapi.json
            git commit -m "style(api): format retrospective Academy reconciliation and regenerate schema"
            git push origin HEAD:codex/academy-retroactive-receipt-adoption-20261009
          fi
