name: Temporary Academy Price CI Artifacts
on:
  push:
    branches: [feat/academy-extra-price-snapshot-20261026]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/academy-extra-price-snapshot-20261026
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - run: |
          ruff format services/sessions_service/routers/academy_participation.py services/sessions_service/models/booking.py services/sessions_service/alembic/versions/ca2610260001_academy_booking_price_audit.py tests/unit/test_academy_classification.py
          ruff check .
          ruff format --check .
          python scripts/api/generate-openapi.py > openapi.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json services/sessions_service/routers/academy_participation.py services/sessions_service/models/booking.py services/sessions_service/alembic/versions/ca2610260001_academy_booking_price_audit.py tests/unit/test_academy_classification.py
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format Academy pricing and regenerate OpenAPI'
            git push origin HEAD:feat/academy-extra-price-snapshot-20261026
          fi
