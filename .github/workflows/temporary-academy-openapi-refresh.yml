name: Temporary Academy OpenAPI Refresh

on:
  push:
    branches:
      - codex/academy-transfer-guided-review-20261009
    paths:
      - .github/workflows/temporary-academy-openapi-refresh.yml

permissions:
  contents: write

jobs:
  refresh-schema:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate tracked OpenAPI schema
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit tracked schema
        run: |
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(api): align Academy OpenAPI to pinned backend dependencies"
            git push origin HEAD:codex/academy-transfer-guided-review-20261009
          fi
