name: Temporary Academy OpenAPI Refresh

on:
  push:
    branches:
      - codex/academy-transfer-guided-review-20261009
    paths:
      - .github/workflows/temporary-academy-openapi-refresh.yml

permissions:
  contents: write

jobs:
  refresh-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install -e .
      - name: Regenerate tracked OpenAPI schema
        run: |
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit tracked schema
        run: |
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(api): regenerate schema for Academy commercial terms"
            git push origin HEAD:codex/academy-transfer-guided-review-20261009
          fi
