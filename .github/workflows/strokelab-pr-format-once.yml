name: StrokeLab feature-branch formatter
on:
  pull_request:
    branches: [develop]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'codex/strokelab-reliability-20261121' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pip install "fastapi==0.111.1" "pydantic==2.12.5" "pydantic-settings==2.13.1"
      - name: Format and refresh OpenAPI
        run: |
          ruff format services/ai_service/analysis/storage.py services/ai_service/routers/analyze.py services/ai_service/routers/public.py services/ai_service/routers/admin_analyze.py services/ai_service/tasks/analyze.py services/ai_service/tasks/maintenance.py services/ai_service/tasks/worker.py services/ai_service/services/provider_usage.py services/ai_service/providers/base.py tests/unit/test_strokelab_cost_budget.py tests/unit/test_strokelab_large_video.py tests/integration/test_ai_public_analyzer.py services/ai_service/schemas/analysis.py services/gateway_service/app/main.py libs/common/config.py
          ruff check --fix services/ai_service/analysis/storage.py services/ai_service/routers/analyze.py services/ai_service/routers/public.py services/ai_service/routers/admin_analyze.py services/ai_service/tasks/analyze.py services/ai_service/tasks/maintenance.py services/ai_service/tasks/worker.py services/ai_service/services/provider_usage.py services/ai_service/providers/base.py tests/unit/test_strokelab_cost_budget.py tests/unit/test_strokelab_large_video.py tests/integration/test_ai_public_analyzer.py services/ai_service/schemas/analysis.py services/gateway_service/app/main.py
          python scripts/api/generate-openapi.py > openapi.json
          git diff --check
          git status --short
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(strokelab): Ruff and OpenAPI synchronization"
            git push origin HEAD:${{ github.head_ref }}
          fi
