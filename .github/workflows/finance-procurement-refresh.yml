name: Temporary finance procurement format and OpenAPI refresh
on:
  push:
    branches: ["feature/finance-intelligence-procurement-20261118"]
    paths: [".github/workflows/finance-procurement-refresh.yml"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format only changed procurement and finance source files and generate API schema
        run: |
          set -euo pipefail
          ruff check --fix services/store_service/models/procurement.py services/store_service/routers/procurement.py services/store_service/routers/procurement_access.py services/store_service/routers/admin_reports.py services/store_service/routers/admin_inventory/_helpers.py services/store_service/services/inventory_costing.py services/ledger_service/routers/intelligence.py services/store_service/alembic/versions/f181126a7301_store_procurement_costing.py tests/unit/test_store_inventory_costing.py
          ruff format services/store_service/models/procurement.py services/store_service/routers/procurement.py services/store_service/routers/procurement_access.py services/store_service/routers/admin_reports.py services/store_service/routers/admin_inventory/_helpers.py services/store_service/services/inventory_costing.py services/ledger_service/routers/intelligence.py services/store_service/alembic/versions/f181126a7301_store_procurement_costing.py tests/unit/test_store_inventory_costing.py
          python scripts/api/generate-openapi.py > /tmp/openapi.generated
          python -m json.tool /tmp/openapi.generated >/dev/null
          mv /tmp/openapi.generated openapi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/store_service/models/procurement.py services/store_service/routers/procurement.py services/store_service/routers/procurement_access.py services/store_service/routers/admin_reports.py services/store_service/routers/admin_inventory/_helpers.py services/store_service/services/inventory_costing.py services/ledger_service/routers/intelligence.py services/store_service/alembic/versions/f181126a7301_store_procurement_costing.py tests/unit/test_store_inventory_costing.py openapi.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(ci): format finance procurement and regenerate OpenAPI"
          git push origin HEAD:refs/heads/feature/finance-intelligence-procurement-20261118
