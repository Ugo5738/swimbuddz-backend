name: Temporary Club OpenAPI snapshot refresh
on:
  pull_request:
    branches: [main]
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate contract and commit to PR branch
        run: |
          python scripts/api/generate-openapi.py > /tmp/openapi.generated.json
          cp /tmp/openapi.generated.json openapi.json
          git add openapi.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate Club video assessment OpenAPI contract"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
