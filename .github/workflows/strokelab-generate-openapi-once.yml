name: Temporary StrokeLab OpenAPI generation
on:
  push:
    branches:
      - codex/strokelab-hardening-20261119
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Regenerate OpenAPI from actual service schemas
        run: |
          python scripts/api/generate-openapi.py > openapi.json
          python -m json.tool openapi.json >/dev/null
          if ! git diff --quiet -- openapi.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add openapi.json
            git commit -m 'docs(strokelab): regenerate combined OpenAPI contract'
            git push
          fi
