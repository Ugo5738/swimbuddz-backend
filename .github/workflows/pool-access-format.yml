name: Format Pool Access Feature Branch
on:
  push:
    branches: [codex/pool-access-platform]
permissions:
  contents: write
jobs:
  format-feature:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply isolated Pool Access formatting
        run: |
          pip install ruff==0.4.10
          files=$(git diff --name-only origin/develop...HEAD -- '*.py')
          if [ -n "$files" ]; then
            echo "$files" | xargs ruff check --fix || true
            echo "$files" | xargs ruff format
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || (git commit -m "style: format Pool Access files" && git push)
