name: Temporary Academy test formatter
on:
  push:
    branches: [feature/academy-per-student-session-entitlements]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff format test and print
        run: |
          pip install ruff==0.4.10
          ruff format tests/unit/test_academy_routine_consumption.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = 'tests/unit/test_academy_routine_consumption.py'
          print('ACADEMY_FORMAT_JSON:' + json.dumps({p: Path(p).read_text()}))
          PY
