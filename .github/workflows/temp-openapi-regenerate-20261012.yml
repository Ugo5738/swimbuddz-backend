name: Temporary feature-branch OpenAPI regeneration
on:
  push:
    branches:
      - feature/vault-bulk-access-and-enrollment-ux-20261012
    paths:
      - .github/workflows/temp-openapi-regenerate-20261012.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Generate exact API contract
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit regenerated API contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if git diff --cached --quiet; then
            echo "OpenAPI already current"
          else
            git commit -m "Regenerate combined OpenAPI schema for media vault endpoints"
            git push origin "HEAD:feature/vault-bulk-access-and-enrollment-ux-20261012"
          fi
