name: Temporary Academy Requirements Formatter
on:
  push:
    branches:
      - codex/academy-requirements-resolver-20261122
permissions:
  contents: write
jobs:
  format-contract:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-requirements-resolver-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install constrained project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format resolver and regenerate OpenAPI contract
        run: |
          ruff check --fix services/academy_service/models/requirements.py services/academy_service/services/requirements_resolver.py services/academy_service/routers/requirements.py tests/integration/test_academy_requirements_resolver.py
          ruff format services/academy_service/models/requirements.py services/academy_service/services/requirements_resolver.py services/academy_service/routers/requirements.py services/academy_service/alembic/versions/a20261122_frozen_cohort_requirements.py tests/integration/test_academy_requirements_resolver.py services/academy_service/app/main.py
          python scripts/api/generate-openapi.py > openapi.json
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/models/requirements.py services/academy_service/services/requirements_resolver.py services/academy_service/routers/requirements.py services/academy_service/alembic/versions/a20261122_frozen_cohort_requirements.py tests/integration/test_academy_requirements_resolver.py services/academy_service/app/main.py openapi.json
            git commit -m "chore(academy): format requirements resolver and update OpenAPI"
            git push origin HEAD:codex/academy-requirements-resolver-20261122
          fi
