name: Integration contract synchronization
on:
  push:
    branches: [integration/october-features-2026]
permissions:
  contents: write
jobs:
  regenerate:
    if: "!contains(github.event.head_commit.message, '[integration-contract-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/october-features-2026
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Generate consolidated OpenAPI
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
          DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
        run: python scripts/api/generate-openapi.py > openapi.json
      - name: Commit generated API contract
        run: |
          git diff --check
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(integration): generated combined OpenAPI [integration-contract-generated]"
            git push origin HEAD:integration/october-features-2026
          fi
