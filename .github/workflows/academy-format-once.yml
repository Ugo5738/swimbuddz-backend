name: One-shot Academy formatter
on:
  push:
    branches: [codex/academy-enrollment-management]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[academy-format-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-enrollment-management
      - run: python -m pip install ruff==0.4.10
      - run: |
          ruff format services/academy_service/routers/enrollments/change_cohort.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/routers/enrollments/change_cohort.py
            git commit -m "style(academy): format review route [academy-format-done]"
            git push origin HEAD:codex/academy-enrollment-management
          fi
