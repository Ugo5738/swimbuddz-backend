name: Sync OpenAPI on mobility branch

on:
  push:
    branches:
      - "feature/club-location-mobility"

permissions:
  contents: write

jobs:
  sync-openapi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/club-location-mobility
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate OpenAPI
        run: python scripts/api/generate-openapi.py > openapi.json

      - name: Commit generated contract when changed
        run: |
          if git diff --quiet -- openapi.json; then
            echo "openapi.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(api): regenerate OpenAPI contract"
          git push origin HEAD:feature/club-location-mobility
