name: Refactor branch autofix

on:
  push:
    branches: ["codex/session-rates-participants"]

permissions:
  contents: write

jobs:
  format-and-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/session-rates-participants
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format and regenerate API schema
        run: |
          ruff check --fix .
          ruff format .
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format refactor and refresh OpenAPI"
          git push origin HEAD:codex/session-rates-participants
