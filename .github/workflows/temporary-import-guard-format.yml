name: Temporary import guard formatter
on:
  push:
    branches: [fix/service-import-guard-finance-guide-20261121]
    paths: [.github/workflows/temporary-import-guard-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project pinned lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format only the new guard test
        run: |
          set -euo pipefail
          ruff check --fix tests/unit/test_service_runtime_boundaries.py
          ruff format tests/unit/test_service_runtime_boundaries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_service_runtime_boundaries.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(ci): format isolated-service boundary regression test"
          git push origin HEAD:refs/heads/fix/service-import-guard-finance-guide-20261121
