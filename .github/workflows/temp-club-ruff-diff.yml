name: Temporary Club Ruff formatting diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  show-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.4.10
      - name: Exact Ruff suggested formatting
        run: |
          ruff format --diff services/media_service/routers/internal.py services/media_service/routers/media.py services/members_service/routers/clubs.py services/members_service/schemas/club.py tests/unit/test_club_video_assessment.py || true
