name: Academy temporary formatter
on:
  push:
    branches: [codex/academy-transfer-guided-review-20261009]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore(academy): apply formatting')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.4.10
      - run: ruff format tests/integration/test_academy_reviewed_paid_transfer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add tests/integration/test_academy_reviewed_paid_transfer.py
            git commit -m "chore(academy): apply formatting"
            git push origin HEAD:codex/academy-transfer-guided-review-20261009
          fi
