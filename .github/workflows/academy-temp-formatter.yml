name: Academy temporary formatter
on:
  push:
    branches: [feature/academy-per-student-session-entitlements]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Emit Ruff formatted file
        run: |
          pip install ruff==0.4.10
          ruff format services/sessions_service/routers/academy_participation.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = 'services/sessions_service/routers/academy_participation.py'
          print('SINGLE_FORMAT_JSON:' + json.dumps({path: Path(path).read_text()}))
          PY
