name: Temporary geo Ruff formatter
on:
  push:
    branches: [codex/pool-directory-discovery-hardening]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(pools): format geo discovery')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pool-directory-discovery-hardening
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format changed files
        run: |
          python -m pip install ruff==0.4.10
          ruff format services/pools_service/routers/directory.py services/pools_service/services/directory_geo.py tests/pools/test_directory_geo.py
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/pools_service/routers/directory.py services/pools_service/services/directory_geo.py tests/pools/test_directory_geo.py
          if ! git diff --cached --quiet; then
            git commit -m "style(pools): format geo discovery"
            git push
          fi
