name: Academy OpenAPI synchronization (temporary)
on:
  push:
    branches: [codex/academy-enrollment-management]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[academy-contract-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-enrollment-management
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/api/generate-openapi.py > openapi.json
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      - run: |
          git diff --check
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(academy): regenerate OpenAPI [academy-contract-sync]"
            git push origin HEAD:codex/academy-enrollment-management
          fi
