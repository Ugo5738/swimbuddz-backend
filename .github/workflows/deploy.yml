name: Backend CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "staging", "develop"]
  pull_request:
    branches: ["main", "master", "staging", "develop"]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DEPLOY_PATH: /home/deploy/swimbuddz-backend
  # Prefer to set REPO_URL as a secret that already includes auth (e.g., https://<token>@github.com/Ugo5738/swimbuddz-backend.git)
  REPO_URL: ${{ secrets.REPO_URL }}
  GPG_PASSPHRASE: ${{ secrets.ENV_FILE_GPG_PASSPHRASE }}

jobs:
  # ------------------------------------------------------------------
  # BACKEND CI
  # ------------------------------------------------------------------
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt pins runtime deps to the versions the containers
          # run, so CI's resolver can't float FastAPI/Pydantic to a newer release
          # that changes OpenAPI schema generation (breaks the openapi.json check).
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Apply service migrations for tests
        run: |
          alembic -c services/members_service/alembic.ini upgrade head
          alembic -c services/academy_service/alembic.ini upgrade head
          alembic -c services/attendance_service/alembic.ini upgrade head
          alembic -c services/communications_service/alembic.ini upgrade head
          alembic -c services/payments_service/alembic.ini upgrade head
          alembic -c services/sessions_service/alembic.ini upgrade head
          alembic -c services/transport_service/alembic.ini upgrade head
          alembic -c services/wallet_service/alembic.ini upgrade head

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v

      - name: Run critical entitlement and booking integration tests
        run: |
          # Keep service model registries isolated. Several services map a
          # lightweight MemberRef to the shared members table, while the
          # members service maps the complete Member model. Running all of
          # these files in one pytest process can corrupt SQLAlchemy mappings.
          pytest -v \
            tests/integration/test_members_entitlement_idempotency.py

          pytest -v \
            tests/integration/test_academy_public.py::test_mark_paid_updates_non_installment_enrollment

          pytest -v \
            tests/integration/test_sessions_book_reconcile.py \
            tests/integration/test_sessions_internal.py::test_paid_booking_confirmation_restores_an_expired_reservation \
            tests/integration/test_sessions_internal.py::test_paid_booking_confirmation_rejects_a_different_member \
            tests/integration/test_sessions_internal.py::test_paid_booking_confirmation_rejects_a_cancelled_session \
            tests/integration/test_sessions_internal.py::test_member_access_preserves_confirmed_booking_but_enforces_window \
            tests/integration/test_sessions_internal.py::test_member_access_rejects_confirmed_booking_outside_window \
            tests/integration/test_sessions_internal.py::test_bundle_reservation_uses_database_prices_and_creates_pending_rows \
            tests/integration/test_sessions_internal.py::test_bundle_reservation_rejects_second_active_payment

          pytest -v \
            tests/integration/test_transport_bookings.py::test_internal_bundle_ride_quote_uses_database_cost \
            tests/integration/test_transport_bookings.py::test_internal_bundle_ride_quote_rejects_cross_session_config \
            tests/integration/test_transport_bookings.py::test_member_must_book_session_before_booking_ride \
            tests/integration/test_transport_bookings.py::test_member_with_confirmed_session_booking_can_book_ride

          pytest -v \
            tests/integration/test_payments_intent_creation.py::test_session_fee_uses_server_total_without_client_amount \
            tests/integration/test_payments_intent_creation.py::test_session_fee_requires_backend_sign_in_access \
            tests/integration/test_payments_intent_creation.py::test_session_booking_uses_server_total_without_client_amount \
            tests/integration/test_payments_intent_creation.py::test_session_bundle_uses_server_total_without_client_amount \
            tests/integration/test_payments_intent_creation.py::test_session_bundle_rejects_tampered_client_total_and_releases_hold \
            tests/integration/test_payments_intent_creation.py::test_ride_share_requires_confirmed_session_booking

          pytest -v \
            tests/integration/test_attendance_walkin.py

      # Guards against the frontend's TypeScript types drifting from backend
      # schemas. The husky pre-commit hook regenerates these locally; this
      # step ensures a hard fail in CI if anyone bypasses the hook with
      # --no-verify or commits from an env without husky configured.
      - name: Verify openapi.json is up to date
        run: |
          python scripts/api/generate-openapi.py > /tmp/openapi.json.generated
          if ! diff -q openapi.json /tmp/openapi.json.generated > /dev/null; then
            echo "::error::openapi.json is stale. Regenerate with:"
            echo "  python scripts/api/generate-openapi.py > openapi.json"
            echo "Then re-run 'npm run generate:types' in swimbuddz-frontend."
            echo "--- diff ---"
            diff openapi.json /tmp/openapi.json.generated | head -100
            exit 1
          fi

      # - name: Run full test suite with coverage
      #   run: |
      #     pytest tests/ --cov=services --cov=libs --cov-report=term-missing --cov-report=xml -v
      #   continue-on-error: false

  # ------------------------------------------------------------------
  # BUILD AND PUSH DOCKER IMAGES
  # ------------------------------------------------------------------
  build-and-push:
    needs: [backend-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            dockerfile: ./services/academy_service/Dockerfile
            image: swimbuddz-academy-service
          - context: .
            dockerfile: ./services/attendance_service/Dockerfile
            image: swimbuddz-attendance-service
          - context: .
            dockerfile: ./services/communications_service/Dockerfile
            image: swimbuddz-communications-service
          - context: .
            dockerfile: ./services/events_service/Dockerfile
            image: swimbuddz-events-service
          - context: .
            dockerfile: ./services/gateway_service/Dockerfile
            image: swimbuddz-gateway-service
          - context: .
            dockerfile: ./services/media_service/Dockerfile
            image: swimbuddz-media-service
          - context: .
            dockerfile: ./services/members_service/Dockerfile
            image: swimbuddz-members-service
          - context: .
            dockerfile: ./services/payments_service/Dockerfile
            image: swimbuddz-payments-service
          - context: .
            dockerfile: ./services/sessions_service/Dockerfile
            image: swimbuddz-sessions-service
          - context: .
            dockerfile: ./services/store_service/Dockerfile
            image: swimbuddz-store-service
          - context: .
            dockerfile: ./services/transport_service/Dockerfile
            image: swimbuddz-transport-service
          - context: .
            dockerfile: ./services/ai_service/Dockerfile
            image: swimbuddz-ai-service
          - context: .
            dockerfile: ./services/wallet_service/Dockerfile
            image: swimbuddz-wallet-service
          - context: .
            dockerfile: ./services/volunteer_service/Dockerfile
            image: swimbuddz-volunteer-service
          - context: .
            dockerfile: ./services/pools_service/Dockerfile
            image: swimbuddz-pools-service
          - context: .
            dockerfile: ./services/reporting_service/Dockerfile
            image: swimbuddz-reporting-service
          - context: .
            dockerfile: ./services/chat_service/Dockerfile
            image: swimbuddz-chat-service
          - context: .
            dockerfile: ./services/ledger_service/Dockerfile
            image: swimbuddz-ledger-service
          - context: .
            dockerfile: ./services/corporate_service/Dockerfile
            image: swimbuddz-corporate-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # DEPLOY TO DIGITAL OCEAN
  # ------------------------------------------------------------------
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          envs: GPG_PASSPHRASE
          script: |
            set -euo pipefail
            set -x

              # Ensure project directory exists
              mkdir -p "${{ env.DEPLOY_PATH }}"
              cd "${{ env.DEPLOY_PATH }}"

              # Clone repo if missing, otherwise fetch/reset to main
              if [ ! -d .git ]; then
                git clone "${{ env.REPO_URL }}" .
              else
                git remote set-url origin "${{ env.REPO_URL }}"
                git fetch origin
                git reset --hard origin/main
              fi

              # Decrypt .env.prod from repository (requires .env.prod.gpg and GPG_PASSPHRASE)
              if [ ! -f .env.prod.gpg ]; then
                echo "Missing .env.prod.gpg in repo. Aborting deploy." >&2
                exit 1
              fi
              if [ -z "${GPG_PASSPHRASE:-}" ]; then
                echo "GPG_PASSPHRASE not set. Aborting deploy." >&2
                exit 1
              fi
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o .env.prod -d .env.prod.gpg

              # Make DOCKER_USERNAME and LE_EMAIL available for compose
              export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
              export LE_EMAIL="${{ secrets.LE_EMAIL }}"
              # Explicitly target a recent Docker API to satisfy the engine minimum supported version
              export DOCKER_API_VERSION="1.52"

              # Login to Docker Hub (to ensure we can pull private images if needed)
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

              # Ensure external network exists for Traefik routing
              docker network inspect swimbuddz_proxy >/dev/null 2>&1 || docker network create swimbuddz_proxy

              # Prepare Traefik ACME storage (Let’s Encrypt)
              mkdir -p letsencrypt
              touch letsencrypt/acme.json
              chmod 600 letsencrypt/acme.json

              # Pull latest images
              echo "==> pulling images"
              COMPOSE_HTTP_TIMEOUT=600 docker compose -f docker-compose.prod.yml pull --no-parallel

              # Apply migrations (production-safe)
              echo "==> running migrations"
              COMPOSE_HTTP_TIMEOUT=600 docker compose -f docker-compose.prod.yml run --rm --no-deps gateway ./scripts/db/migrate-prod.sh --all .env.prod

              # Restart services
              echo "==> bringing up services"
              COMPOSE_HTTP_TIMEOUT=600 docker compose -f docker-compose.prod.yml up -d --wait

              # Cleanup unused images
              echo "==> pruning images"
              docker image prune -f

  # ------------------------------------------------------------------
  # DEPLOY TO STAGING (NO PROD IMPACT)
  # ------------------------------------------------------------------
  deploy-staging:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    # if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    if: false # Disabled until staging server is provisioned

    steps:
      - name: Deploy to Staging (Digital Ocean)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_STAGING }}
          username: ${{ secrets.DO_USERNAME_STAGING }}
          key: ${{ secrets.DO_SSH_KEY_STAGING }}
          command_timeout: 30m
          envs: GPG_PASSPHRASE
          script: |
            set -euo pipefail
            set -x

              # Ensure project directory exists
              mkdir -p "${{ env.DEPLOY_PATH }}"
              cd "${{ env.DEPLOY_PATH }}"

              # Clone repo if missing, otherwise fetch/reset to staging
              if [ ! -d .git ]; then
                git clone "${{ env.REPO_URL }}" .
              else
                git remote set-url origin "${{ env.REPO_URL }}"
                git fetch origin
                git reset --hard origin/staging
              fi

              # Decrypt .env.prod.gpg into .env.prod (staging env file encrypted separately)
              if [ ! -f .env.prod.gpg ]; then
                echo "Missing .env.prod.gpg in repo. Aborting deploy." >&2
                exit 1
              fi
              if [ -z "${GPG_PASSPHRASE:-}" ]; then
                echo "GPG_PASSPHRASE not set. Aborting deploy." >&2
                exit 1
              fi
              echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 -o .env.prod -d .env.prod.gpg

              # Make DOCKER_USERNAME and LE_EMAIL available for compose
              export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
              export LE_EMAIL="${{ secrets.LE_EMAIL }}"
              export DOCKER_API_VERSION="1.52"

              # Login to Docker Hub
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

              # Ensure external network exists for Traefik routing
              docker network inspect swimbuddz_proxy >/dev/null 2>&1 || docker network create swimbuddz_proxy

              # Prepare Traefik ACME storage (Let’s Encrypt)
              mkdir -p letsencrypt
              touch letsencrypt/acme.json
              chmod 600 letsencrypt/acme.json

              # Pull latest images
              echo "==> pulling images"
              COMPOSE_HTTP_TIMEOUT=600 docker compose -f docker-compose.prod.yml pull --no-parallel

              # Restart services
              echo "==> bringing up services"
              COMPOSE_HTTP_TIMEOUT=600 docker compose -f docker-compose.prod.yml up -d --wait

              # Cleanup unused images
              echo "==> pruning images"
              docker image prune -f

