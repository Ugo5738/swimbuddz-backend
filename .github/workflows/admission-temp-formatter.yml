name: Temporary admission formatter
on:
  push:
    branches: [feature/admin-session-admission-policy-20261025]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-session-admission-policy-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff-format feature implementation only
        run: |
          pip install ruff==0.4.10
          ruff format services/sessions_service/routers/bookings.py services/sessions_service/routers/participants.py services/sessions_service/services/booking_capacity.py
          if git diff --quiet -- services/sessions_service/routers/bookings.py services/sessions_service/routers/participants.py services/sessions_service/services/booking_capacity.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/sessions_service/routers/bookings.py services/sessions_service/routers/participants.py services/sessions_service/services/booking_capacity.py
          git commit -m 'style: Ruff-format admissions flow'
          git pull --rebase origin feature/admin-session-admission-policy-20261025
          git push origin HEAD:feature/admin-session-admission-policy-20261025
