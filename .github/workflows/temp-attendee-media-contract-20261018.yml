name: Temporary Attendee Media API Contract
on:
  push:
    branches:
      - feature/attendee-media-collections-20261018
    paths:
      - .github/workflows/temp-attendee-media-contract-20261018.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendee-media-collections-20261018
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format code and regenerate API
        run: |
          ruff check . --fix
          ruff format services/media_service/models/vault.py services/media_service/models/__init__.py services/media_service/services/vault_access.py services/media_service/routers/vaults.py services/media_service/schemas/vault.py services/media_service/schemas/__init__.py services/media_service/alembic/versions/f18a47d20311_attendee_media_and_collections.py tests/unit/test_attendee_media_and_collections.py
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit generated files
        run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add openapi.json services/media_service tests/unit/test_attendee_media_and_collections.py
          if ! git diff --cached --quiet; then
            git commit -m "Format attendee media features and refresh OpenAPI"
            git push origin HEAD:feature/attendee-media-collections-20261018
          fi
