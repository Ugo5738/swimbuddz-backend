name: Regenerate Finance PR OpenAPI snapshot
on:
  push:
    branches:
      - feat/finance-bank-account-registry-20261121
    paths:
      - '.github/workflows/regenerate-openapi-finance-pr.yml'
permissions:
  contents: write
jobs:
  refresh-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate exact OpenAPI snapshot
        run: |
          python -m pip install -e '.[dev]' -c constraints.txt
          python scripts/api/generate-openapi.py > openapi.json
      - name: Commit regenerated snapshot to the PR branch
        run: |
          if git diff --quiet -- openapi.json; then
            echo "OpenAPI is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git commit -m 'chore(api): regenerate bank registry OpenAPI snapshot'
          git push origin HEAD:feat/finance-bank-account-registry-20261121
