name: Temporary admission test formatter
on:
  push:
    branches: [feature/admin-session-admission-policy-20261025]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-session-admission-policy-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ruff==0.4.10
          ruff format tests/unit/test_session_booking_pricing_regressions.py
          if git diff --quiet -- tests/unit/test_session_booking_pricing_regressions.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/test_session_booking_pricing_regressions.py
          git commit -m 'style: normalize Academy admission regression test'
          git pull --rebase origin feature/admin-session-admission-policy-20261025
          git push origin HEAD:feature/admin-session-admission-policy-20261025
