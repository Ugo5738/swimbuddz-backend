name: Regenerate OpenAPI for PR 427 (one-time)

on:
  push:
    branches:
      - feature/member-swim-booking-workspace-20261119

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/feature/member-swim-booking-workspace-20261119'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned schema generator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Regenerate and validate OpenAPI schema
        run: |
          python scripts/api/generate-openapi.py > openapi.json
          python -c "import json; data=json.load(open('openapi.json')); assert '/api/v1/sessions/me/next-swim' in data['paths']; assert '/api/v1/pools/access/availability' in data['paths']; assert 'cohort_id' in data['components']['schemas']['CalendarItemResponse']['properties']"
      - name: Commit regenerated schema to PR branch
        run: |
          if git diff --quiet -- openapi.json; then
            echo "OpenAPI schema is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          git commit -m "chore(openapi): regenerate API contracts for member swim booking"
          git push origin HEAD:feature/member-swim-booking-workspace-20261119
