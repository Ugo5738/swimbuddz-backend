name: Refresh Academy OpenAPI PR 368
on:
  push:
    branches:
      - feat/academy-knowledge-quizzes-review-20261023
    paths:
      - .github/workflows/refresh-academy-openapi-pr368.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact backend CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Generate and commit OpenAPI
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test_db
        run: |
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(api): regenerate Academy OpenAPI with pinned versions"
            git push origin HEAD:feat/academy-knowledge-quizzes-review-20261023
          fi
