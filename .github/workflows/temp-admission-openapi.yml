name: Temporary OpenAPI regeneration
on:
  push:
    branches: [feature/admin-session-admission-policy-20261025]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-session-admission-policy-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -e .
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/swimbuddz python scripts/api/generate-openapi.py > openapi.json
          if git diff --quiet -- openapi.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.json
          git commit -m 'docs(api): regenerate OpenAPI for member admission preview'
          git pull --rebase origin feature/admin-session-admission-policy-20261025
          git push origin HEAD:feature/admin-session-admission-policy-20261025
