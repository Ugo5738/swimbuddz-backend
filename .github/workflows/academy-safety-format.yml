name: Academy Safety Format
on:
  push:
    branches: [codex/pool-access-platform]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ruff==0.4.10
          ruff format services/attendance_service/routers/member/_shared.py services/attendance_service/routers/member/coach_mark.py services/members_service/routers/internal/swim_clearance.py tests/unit/test_academy_pre_swim_clearance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || (git commit -m "style: format Academy safety clearance" && git push)
