name: Regenerate Academy OpenAPI (temporary)
on:
  push:
    branches:
      - feature/academy-access-and-evidence-hardening-20261118
  pull_request:
    branches:
      - develop
permissions:
  contents: write
jobs:
  sync-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/academy-access-and-evidence-hardening-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c constraints.txt
      - name: Regenerate and commit OpenAPI for this PR only
        run: |
          python scripts/api/generate-openapi.py > openapi.json
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore(api): update Academy progress security contract"
            git push origin HEAD:feature/academy-access-and-evidence-hardening-20261118
          fi
