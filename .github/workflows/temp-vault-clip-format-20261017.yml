name: Temporary Vault Clip Formatting and Contract
on:
  push:
    branches: [feature/vault-member-clip-editor-20261017]
    paths: [.github/workflows/temp-vault-clip-format-20261017.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vault-member-clip-editor-20261017
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - run: |
          ruff check . --fix
          ruff format services/media_service/routers/vaults.py services/media_service/tasks/member_clips.py services/media_service/schemas/vault.py tests/unit/test_session_media_access_and_clips.py
          python scripts/api/generate-openapi.py > openapi.json
      - run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add openapi.json services/media_service tests/unit/test_session_media_access_and_clips.py
          if ! git diff --cached --quiet; then
            git commit -m "Format vault clip edits and regenerate API contract"
            git push origin HEAD:feature/vault-member-clip-editor-20261017
          fi
