name: Format and regenerate Swim Plans API (temporary)
on:
  push:
    branches:
      - feature/swim-planning-workspace-20261119
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feature/swim-planning-workspace-20261119'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format modified files and generate OpenAPI
        run: |
          ruff format services/events_service/alembic/env.py services/events_service/app/tests/test_open_swim.py services/events_service/models/__init__.py services/events_service/models/swim_plan.py services/events_service/routers/swim_plans.py services/events_service/routers/member.py services/events_service/app/main.py services/events_service/alembic/versions/9b7c4d2e6105_member_swim_plans.py
          python scripts/api/generate-openapi.py > openapi.json
          python -c "import json; d=json.load(open('openapi.json')); assert '/api/v1/events/swim-plans' in d['paths']; assert '/api/v1/events/swim-plans/admin/policy' in d['paths']"
      - name: Commit updated files
        run: |
          if git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json services/events_service
          git commit -m "chore: format swim planning code and regenerate OpenAPI"
          git push origin HEAD:feature/swim-planning-workspace-20261119
