name: Temporary Academy Catalog Codegen
on:
  push:
    branches:
      - codex/academy-curriculum-catalog-20261122
  pull_request:
    branches:
      - develop
permissions:
  contents: write
jobs:
  codegen:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/academy-curriculum-catalog-20261122
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format authored source and regenerate API contract
        run: |
          ruff check --fix services/academy_service/models/curriculum_library.py services/academy_service/routers/curriculum_library.py tests/integration/test_academy_curriculum_library.py
          ruff format services/academy_service/models/curriculum_library.py services/academy_service/routers/curriculum_library.py services/academy_service/alembic/versions/a20261122_independent_curriculum_catalog.py tests/integration/test_academy_curriculum_library.py
          python scripts/api/generate-openapi.py > openapi.json
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/academy_service/models/curriculum_library.py services/academy_service/routers/curriculum_library.py services/academy_service/alembic/versions/a20261122_independent_curriculum_catalog.py tests/integration/test_academy_curriculum_library.py openapi.json
            git commit -m "chore(academy): format catalog and regenerate API contract"
            git push origin HEAD:codex/academy-curriculum-catalog-20261122
          fi
