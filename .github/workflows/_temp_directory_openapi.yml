name: Temporary directory OpenAPI regeneration
on:
  push:
    branches:
      - feature/public-pool-directory-20261021
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, 'chore(api): regenerate pinned OpenAPI contract')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-pool-directory-20261021
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate contract using production dependency constraints
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/swimbuddz
        run: |
          python -m pip install -e ".[dev]" -c constraints.txt
          python scripts/api/generate-openapi.py > openapi.json
          git config user.name "swimbuddz-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): regenerate pinned OpenAPI contract"
            git push
          fi
