name: Temporary final alumni contract sync
on:
  push:
    branches: [codex/alumni-evidence-beyond-pool]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e ".[dev]" -c constraints.txt
          ruff format .
          python scripts/api/generate-openapi.py > openapi.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): format reporting attribution and synchronize API contract"
            git push origin HEAD:codex/alumni-evidence-beyond-pool
          fi
