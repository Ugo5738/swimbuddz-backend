name: Format Pool Access Recovery
on:
  push:
    branches: [codex/pool-access-platform]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install ruff==0.4.10
          ruff format services/payments_service/routers/intents/intent_creation.py services/payments_service/services/product_intent_retry.py services/pools_service/models/access.py services/pools_service/routers/access.py tests/integration/test_pool_access_bookings.py services/pools_service/alembic/versions/ac20261008d4_cancel_requests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet || (git commit -m "style: format Pool Access recovery and refund workflows" && git push)
