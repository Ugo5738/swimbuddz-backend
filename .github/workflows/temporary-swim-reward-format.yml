name: Temporary swim rewards formatter
on:
  push:
    branches:
      - codex/automatic-swim-rewards-20261122
jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.4.10
      - name: Print formatter patch
        shell: bash
        run: |
          ruff format services/attendance_service/services/swim_rewards.py services/wallet_service/services/swim_rewards.py tests/unit/test_verified_swim_rewards.py
          echo 'FORMAT_PATCH_START'
          git diff -- services/attendance_service/services/swim_rewards.py services/wallet_service/services/swim_rewards.py tests/unit/test_verified_swim_rewards.py | base64 -w0
          echo
          echo 'FORMAT_PATCH_END'
