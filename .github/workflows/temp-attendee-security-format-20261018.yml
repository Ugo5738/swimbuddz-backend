name: Temporary Attendee Media Security Formatting
on:
  push:
    branches: [feature/attendee-media-collections-20261018]
    paths: [.github/workflows/temp-attendee-security-format-20261018.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/attendee-media-collections-20261018
          fetch-depth: 0
      - run: |
          python -m pip install ruff==0.4.10
          ruff check services/media_service/routers/vaults.py services/media_service/services/vault_access.py --fix
          ruff format services/media_service/routers/vaults.py services/media_service/services/vault_access.py
      - run: |
          git config user.name "swimbuddz-ci"
          git config user.email "swimbuddz-ci@users.noreply.github.com"
          git add services/media_service/routers/vaults.py services/media_service/services/vault_access.py
          if ! git diff --cached --quiet; then
            git commit -m "Format security checks for attendance based media"
            git push origin HEAD:feature/attendee-media-collections-20261018
          fi
