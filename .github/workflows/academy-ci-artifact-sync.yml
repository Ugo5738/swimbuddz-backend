name: Temporary Academy CI artifact sync
on:
  push:
    branches:
      - feat/academy-baseline-preview-paid-extra-20261025
permissions:
  contents: write
jobs:
  format-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test_db
      DATABASE_SESSION_URL: postgresql+psycopg://test:test@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/academy-baseline-preview-paid-extra-20261025
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Format and regenerate using CI tooling
        run: |
          ruff check .
          ruff format services/academy_service/routers/enrollments/class_entitlements.py
          python scripts/api/generate-openapi.py > openapi.json
          ruff check .
          ruff format --check .
      - name: Commit generated files to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/academy_service/routers/enrollments/class_entitlements.py openapi.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ci): apply Ruff format and regenerate OpenAPI'
            git push origin HEAD:feat/academy-baseline-preview-paid-extra-20261025
          fi
